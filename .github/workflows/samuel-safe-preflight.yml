name: Samuel Store 2.0 - verificacion estatica segura

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar solo la rama de desarrollo
        uses: actions/checkout@v4
        with:
          ref: samuel-dev
          persist-credentials: false
      - name: Preparar Node.js sin instalar dependencias
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verificar estructura sin ejecutar scripts del proyecto
        run: node scripts/samuel-preflight.mjs
      - name: Confirmar aislamiento
        run: |
          echo "Sin npm/pnpm install, sin secretos, sin Supabase, sin Netlify."
          echo "Esta verificacion NO prueba compilacion ni seguridad integral."
